version: 2.1
jobs:
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Generate python version cache key
          command: python3 --version > PY_VERSION
      - restore_cache:
          key:  v3-{{ checksum "PY_VERSION" }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements/test.txt" }}
          paths:
            - "venv"
      - run:
          name: Install pip packages
          command: |
            python3 -m venv venv
            venv/bin/pip install --upgrade -r requirements/test.txt
      - save_cache:
          key:  v3-{{ checksum "PY_VERSION" }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements/test.txt" }}
          paths:
            - "venv"
      - run:
          name: pip freeze
          command: venv/bin/pip freeze
      - run:
          name: flake8
          command: venv/bin/flake8 pyticketswitch
      - run:
          name: black
          command: venv/bin/black pyticketswitch
      - run:
          name: behave coverage
          command: |
            . venv/bin/activate
            coverage run -m behave --no-capture --no-color --format progress2 --junit --tags=-skip
      - run:
          name: pytest plus coverage
          command: |
            . venv/bin/activate
            coverage run -m pytest
      - run:
          name: Report Python code coverage
          command: |
            . venv/bin/activate
            coverage combine
            coverage report
            # CODECOV_TOKEN must be set as a CircleCI environment variable
            python -m codecov -t "$CODECOV_TOKEN"

workflows:
  version: 2
  test:
    jobs:
      - test

