version: 2.1
jobs:
  test:
    parameters:
      python-version:
        type: string
      upload-coverage:
        type: boolean
        default: false
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Generate python version cache key
          command: python3 --version > PY_VERSION
      - restore_cache:
          key:  v3-{{ checksum "PY_VERSION" }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements/test.txt" }}
          paths:
            - "venv"
      - run:
          name: Install pip packages
          command: |
            python3 -m venv venv
            venv/bin/pip install --upgrade -r requirements/test.txt
      - save_cache:
          key:  v3-{{ checksum "PY_VERSION" }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements/test.txt" }}
          paths:
            - "venv"
      - run:
          name: pip freeze
          command: venv/bin/pip freeze
      - run:
          name: Static checks (ruff + pyright)
          command: make check
      - run:
          name: behave coverage
          command: |
            . venv/bin/activate
            coverage run -m behave --no-capture --no-color --format progress2 --junit --tags=-skip
      - run:
          name: pytest plus coverage
          command: |
            . venv/bin/activate
            coverage run -m pytest --junitxml=junit.xml -o junit_family=legacy
      - when:
          condition: << parameters.upload-coverage >>
          steps:
            - run:
                name: Install Codecov CLI
                when: always
                command: |
                  curl -fsSO https://cli.codecov.io/latest/linux/codecov
                  chmod +x codecov
            - run:
                name: Upload test results to Codecov
                when: always
                # CODECOV_TOKEN must be set as a CircleCI environment variable
                command: |
                  ./codecov do-upload --report-type test_results --fail-on-error -t "$CODECOV_TOKEN" -f junit.xml
      - run:
          name: Report Python code coverage
          command: |
            . venv/bin/activate
            coverage combine
            coverage report
            coverage xml
      - when:
          condition: << parameters.upload-coverage >>
          steps:
            - run:
                name: Upload coverage to Codecov
                # CODECOV_TOKEN must be set as a CircleCI environment variable
                command: |
                  ./codecov upload-process --fail-on-error -t "$CODECOV_TOKEN" -f coverage.xml

workflows:
  version: 2
  test:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.10", "3.12"]
      # coverage is uploaded from a single job to avoid duplicate uploads
      - test:
          name: test-3.14
          python-version: "3.14"
          upload-coverage: true

