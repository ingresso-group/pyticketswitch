[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyticketswitch"
dynamic = ["version"]
description = "A Python interface for the Ingresso F13 API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ingresso", email = "systems@ingresso.co.uk" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dateutil>=2.8.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/ingresso-group/pyticketswitch/"

[tool.setuptools]
packages = ["pyticketswitch"]

[tool.setuptools.dynamic]
version = { attr = "pyticketswitch.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs", "features"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "C90",  # mccabe complexity
    "RUF",  # ruff-specific
    "PIE",  # flake8-pie
    "FURB",  # refurb
    "RET504",  # unnecessary assignment before return
    "TC006",  # quoted type in cast()
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
include = ["pyticketswitch"]
pythonVersion = "3.10"
venvPath = "."
venv = "venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["logs"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
omit = ["*features*", "*tests*"]
parallel = true

[tool.coverage.report]
exclude_lines = ["def __repr__"]
